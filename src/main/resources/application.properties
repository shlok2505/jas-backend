spring.application.name=sarees
spring.datasource.url=jdbc:postgresql://localhost:5432/jas_sarees
spring.datasource.username=jas_user
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.6-flash
app.jwt-secret=${JWT_SECRET:}
app.cors-origins=${CORS_ORIGINS:http://localhost:3000}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
# Cash on delivery is offered only for sarees priced above this (rupees)
app.cod-min-price=${COD_MIN_PRICE:500}
